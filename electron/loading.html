<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starting ADHD</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; color: #f5f7ff; background: #090b10; }
    body::before { content: ''; position: fixed; width: 36rem; height: 36rem; border-radius: 50%; background: #5065ff; filter: blur(160px); opacity: .18; }
    main { position: relative; width: min(32rem, calc(100vw - 3rem)); padding: 3rem; text-align: center; border: 1px solid #ffffff16; border-radius: 1.5rem; background: #11141bcc; box-shadow: 0 24px 80px #0008; backdrop-filter: blur(24px); }
    .mark { display: grid; place-items: center; width: 4.5rem; height: 4.5rem; margin: 0 auto 1.5rem; border-radius: 1.25rem; background: linear-gradient(145deg, #7586ff, #4055e9); box-shadow: 0 12px 40px #5065ff55; font-size: 1.7rem; font-weight: 850; letter-spacing: -.08em; }
    h1 { margin: 0; font-size: 2rem; letter-spacing: -.04em; }
    p { margin: .75rem 0 2rem; color: #aab1c5; line-height: 1.6; }
    .track { height: .3rem; overflow: hidden; border-radius: 1rem; background: #ffffff12; }
    .track::after { content: ''; display: block; width: 42%; height: 100%; border-radius: inherit; background: #7183ff; animation: load 1.35s ease-in-out infinite; }
    small { display: block; margin-top: 1.25rem; color: #697187; }
    @keyframes load { from { transform: translateX(-110%); } to { transform: translateX(340%); } }
  </style>
</head>
<body>
  <main>
    <div class="mark">A</div>
    <h1>ADHD</h1>
    <p>Starting DeepSeek Harness and preparing your workspace…</p>
    <div class="track"></div>
    <small>Awesome DeepSeek Harness Desktop</small>
  </main>
</body>
</html>
